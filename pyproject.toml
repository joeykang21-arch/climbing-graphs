[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climbing-graphs"
version = "1.0.0"
description = "Graphs ranking the world's best climbers and tracking how climbing grades have progressed."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joseph Kang" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "lxml>=4.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "python-dateutil>=2.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
climbing-graphs = "climbing_graphs.cli:main"

[tool.setuptools.packages.find]
include = ["climbing_graphs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
